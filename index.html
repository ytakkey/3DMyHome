<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3Dマイホーム</title>
<!-- 入口（2026-11-09 ユーザー「入口は一本化して、どちらのバージョンを開くか選ぶ形に」）：①リアル版＝焼いた光の stg/、②軽量・検証版＝three.js で組み立てる lite/ -->
<style>
:root{--bg:#141c28;--card:rgba(30,25,21,.86);--line:rgba(245,239,230,.14);--tx:#f5efe6;--mut:rgba(245,239,230,.62);--acc:#ffd9a8}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic UI",system-ui,sans-serif}
main{box-sizing:border-box;max-width:720px;margin:0 auto;padding:calc(40px + env(safe-area-inset-top,0px)) 16px 40px}
h1{margin:0 0 6px;font-size:22px;font-weight:600;letter-spacing:.04em}
.lead{margin:0 0 24px;font-size:13px;color:var(--mut)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:560px){.cards{grid-template-columns:1fr}}
a.card{display:flex;flex-direction:column;gap:10px;padding:18px;border-radius:14px;background:var(--card);border:1px solid var(--line);color:inherit;text-decoration:none;box-shadow:0 8px 28px rgba(0,0,0,.3);transition:border-color .15s,background .15s}
a.card:hover,a.card:focus-visible{border-color:rgba(255,217,168,.6);outline:none}
a.card:active{background:rgba(255,205,145,.12)}
.no{font-size:12px;font-weight:600;color:var(--acc)}
.nm{font-size:18px;font-weight:600}
.ds{margin:0;font-size:13px;line-height:1.7;color:var(--mut)}
ul{margin:0;padding-left:1.2em;font-size:12.5px;line-height:1.8}
.go{margin-top:auto;align-self:flex-start;padding:9px 16px;border-radius:10px;background:linear-gradient(#ffe2b0,#ffc472);color:#2a1c0c;font-size:13px;font-weight:600}
</style>
</head>
<body>
<main>
  <h1>3Dマイホーム</h1>
  <p class="lead">開く版を選んでください</p>
  <div class="cards">
    <a class="card" href="stg/">
      <span class="no">①</span><span class="nm">リアル版</span>
      <p class="ds">光と影の質を重視。Blender で計算した光で、部屋の明るさや陰を本物に近く見られます。</p>
      <ul><li>昼・夜、照明の点灯・消灯、ドアの開閉で光が変わる</li><li>読み込む画像が多いので、開くのに少し時間がかかります（PC・iPad 向け）</li></ul>
      <span class="go">リアル版を開く</span>
    </a>
    <a class="card" href="lite/">
      <span class="no">②</span><span class="nm">軽量・検証版</span>
      <p class="ds">すぐ開いて軽く動く版。家具の大きさを変えて、置いたときの感じを確かめられます。</p>
      <ul><li>昼だけ。照明は暗い所（トイレ・WIC・洗面所・浴室）だけ点灯</li><li>家具のサイズ変更（ダイニングテーブル）</li></ul>
      <span class="go">軽量・検証版を開く</span>
    </a>
  </div>
</main>
</body>
</html>
