<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3Dマイホーム</title>
<link rel="stylesheet" href="css/style.css">
<link rel="preload" href="js/three.min.js" as="script">
<link rel="preload" href="js/common.js" as="script">
<link rel="preload" href="js/bedroom.js" as="script">
<link rel="preload" href="js/study.js" as="script">
<link rel="preload" href="js/kitchen_panel.js" as="script">
<link rel="preload" href="js/ldk.js" as="script">
<link rel="preload" href="js/wash.js" as="script">
<link rel="preload" href="js/bath.js" as="script">
<link rel="preload" href="js/lighting.js" as="script">
<link rel="preload" href="js/build.js" as="script">
<link rel="preload" href="js/ui.js" as="script">
</head>
<body>
<div id="loading" role="status"><div class="ld"><i class="spin"></i><span>読み込み中…</span></div><div class="lbar"><b id="ldBar"></b></div></div>   <!-- 読み込み中の表示（読み終わると消える） -->
<div id="panel">   <!-- メニュー（右下）：アイコンのバーと、その上に1つずつ開くパネル（最小化はなし） -->
  <div id="sheet" class="box" hidden>
    <div id="p_view" class="pg" hidden><div class="pt">視点</div><div class="vgrid" id="viewRow"></div></div>
    <div id="p_light" class="pg" hidden><div class="pt">照明</div>
      <div class="seg sm" aria-label="照明（すべて）"><button id="tAllOn">全点灯</button><button id="tAllOff">全消灯</button></div>
      <div class="rsel"><span id="roomLbl"></span><button id="tAllRooms" class="ic txt">すべての部屋</button></div>
      <div id="indList" class="ind"></div></div>
    <div id="p_shade" class="pg" hidden><div class="pt">シェード</div><div class="row shade"><input type="range" id="shade" min="0" max="100" step="10" value="0" aria-label="シェード"><b id="shadeOut">全開</b></div></div>
  </div>
  <div id="bar" class="box">
    <button id="bView" class="bb" aria-label="視点" title="視点"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><span id="viewLbl"></span></button>
    <button id="bDay" class="bb" aria-label="昼（押すと夜）" title="昼／夜"><svg class="isun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg><svg class="imoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></button>
    <button id="bLight" class="bb" aria-label="照明" title="照明"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 18h5M10.5 21h3M12 3a6 6 0 0 0-3.8 10.6c.8.7 1.3 1.6 1.3 2.6V17h5v-.8c0-1 .5-1.9 1.3-2.6A6 6 0 0 0 12 3z"/></svg><i class="dot"></i></button>
    <button id="bShade" class="bb" aria-label="シェード" title="シェード"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 4h17M5 4v10h14V4M5 7.5h14M5 11h14M12 14v4"/><circle cx="12" cy="19.5" r="1.2"/></svg></button>
    <span class="sep"></span>
    <button id="tFs" class="bb sm" aria-label="全画面" title="全画面"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </div>
</div>
<div id="move" class="ui">
  <div class="joy" id="joy" aria-label="移動（ドラッグした方向へ進む）"><div class="knob"></div></div>
  <div class="lift">
    <button data-k="u" aria-label="上へ"><svg viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button data-k="d" aria-label="下へ"><svg viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>
</div>
<script>   // 読み込み：js のファイルを並べた順に1つずつ実行する（取得は preload で並行）。ファイルごとに画面を更新して進み具合を出し、最後（ui.js の最初の描画）が終わったら読み込み中の表示を消す
(()=>{const FILES=['three.min.js','common.js','bedroom.js','study.js','kitchen_panel.js','ldk.js','wash.js','bath.js','lighting.js','build.js','ui.js'];
 const box=document.getElementById('loading'),bar=document.getElementById('ldBar');let i=0,failed=false;
 const fail=()=>{failed=true;box.querySelector('span').textContent='読み込みに失敗しました';box.querySelector('.spin').hidden=true;};
 const next=()=>{let go=false;const f=()=>{if(!go){go=true;setTimeout(load,0);}};requestAnimationFrame(f);setTimeout(f,100);};   // 画面の更新を待って次へ（裏のタブなどで画面の更新が止まっていても進むように、時間でも進める）
 const load=()=>{if(failed)return;if(i===FILES.length){window.removeEventListener('error',fail);box.classList.add('done');setTimeout(()=>box.remove(),400);return;}
  const sc=document.createElement('script');sc.src='js/'+FILES[i++];sc.onload=()=>{bar.style.width=(i/FILES.length*100)+'%';next();};sc.onerror=fail;document.body.appendChild(sc);};
 window.addEventListener('error',fail);load();})();
</script>
</body>
</html>
